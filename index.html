<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rack Elevation Builder · Standalone Block Editor</title>
  <link rel="stylesheet" href="./vendor/apk-contracts/apk-tokens.css">
  <link rel="stylesheet" href="./css/theme.css">
  <link rel="stylesheet" href="./vendor/apk-table/apk-table.css">
  <style>
    .elevation-container {
      display: grid;
      grid-template-columns: 340px 1fr;
      grid-template-rows: 1fr 240px;
      height: calc(100vh - 40px);
      overflow: hidden;
    }

    .elevation-sidebar {
      grid-column: 1;
      grid-row: 1;
      border-right: 1px solid var(--osc-border-default);
      background: var(--osc-bg-surface);
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 14px;
      overflow-y: auto;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-group label {
      font-size: 11px;
      font-weight: 600;
      color: var(--osc-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .metrics-card {
      background: var(--osc-bg-input);
      border: 1px solid var(--osc-border-default);
      border-radius: 4px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .metric-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
    }

    .metric-label {
      color: var(--osc-text-muted);
    }

    .metric-value {
      font-family: var(--font-mono);
      font-weight: bold;
      color: var(--osc-accent-primary);
    }

    .preview-panel {
      grid-column: 2;
      grid-row: 1;
      background: var(--osc-bg-base);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .preview-header {
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      border-bottom: 1px solid var(--osc-border-default);
      background: var(--osc-bg-surface);
    }

    .preview-stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: auto;
      background: radial-gradient(circle at 50% 50%, #1e1e24 0%, #121212 100%);
    }

    .preview-stage svg {
      max-height: 95%;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      border-radius: 4px;
    }

    .data-grid-panel {
      grid-column: 1 / 3;
      grid-row: 2;
      border-top: 1px solid var(--osc-border-default);
      background: var(--osc-bg-surface);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .data-grid-header {
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      border-bottom: 1px solid var(--osc-border-default);
      background: var(--osc-bg-surface-hover);
    }

    .data-table-container {
      flex: 1;
      overflow: auto;
    }

    #device-table { font-size: 11px; }

    .discovery-status { font-size: 10px; color: var(--osc-text-muted); max-width: 260px; }
    .discovery-status[data-apk-state="dead"], .live-state[data-apk-state="dead"] { color: var(--apk-state-dead, #ef4444); }
    .discovery-status[data-apk-state="good"], .live-state[data-apk-state="good"] { color: var(--apk-state-good, #22c55e); }
    .discovery-status[data-apk-state="kinda"], .live-state[data-apk-state="kinda"] { color: var(--apk-state-kinda, #eab308); }

  </style>
</head>
<body class="theme-deep-horizon">
  <header class="app-window-header">
    <div class="window-title-group">
      <span class="window-dot"></span>
      <span class="window-title">Rack Elevation Builder</span>
      <span class="window-pill" id="block-tag">STANDALONE BLOCK EDITOR</span>
    </div>
    <div class="window-actions">
      <span class="discovery-status" id="discovery-status" role="status"></span>
      <button class="btn btn-secondary" id="btn-sync-discovered" title="Install what the bus has discovered (and is not in this rack yet)">
        <span class="btn-icon">⚡</span> Discovered
      </button>
      <button class="btn btn-secondary" id="btn-open" title="Open a rack: its .ifc twin or the block .json">
        <span class="btn-icon">📂</span> Open
      </button>
      <button class="btn btn-secondary" id="btn-save-model" title="Save Model: the rack as .json and its .ifc twin (IFC4X3), both or neither">
        <span class="btn-icon">🏗</span> Save Model
      </button>
      <button class="btn btn-primary" id="btn-save" title="Save & Return modified block to caller">
        <span class="btn-icon">💾</span> Save & Return
      </button>
      <button class="btn btn-icon" id="btn-close" title="Close Editor">✕</button>
    </div>
  </header>

  <div class="elevation-container">
    <aside class="elevation-sidebar">
      <div class="form-group">
        <label for="input-rack-name">Rack Name / Identifier</label>
        <input type="text" id="input-rack-name" class="input" value="RACK-01 (MDF Core)">
      </div>

      <div class="form-group">
        <label for="input-total-ru">Total Rack Units (RU)</label>
        <select id="input-total-ru" class="input">
          <option value="12">12 RU (Half-Height)</option>
          <option value="24">24 RU (Compact)</option>
          <option value="42" selected>42 RU (Standard Full-Height)</option>
          <option value="45">45 RU (Deep Datacenter)</option>
          <option value="48">48 RU (Tall Frame)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="input-frame-kg">Empty Frame Weight (kg)</label>
        <input type="number" id="input-frame-kg" class="input" min="0" step="0.1" placeholder="unknown"
          title="The rack's own weight, empty: in its total weight, not in its payload">
      </div>

      <div class="form-group">
        <label for="input-load-rating">Static Load Rating (kg)</label>
        <input type="number" id="input-load-rating" class="input" min="0" step="0.1" placeholder="unknown"
          title="What the frame may carry standing (APK_Rack.StaticLoadRating): the payload is checked against it">
      </div>

      <div class="form-group">
        <label for="select-face">Elevation View Face</label>
        <select id="select-face" class="input">
          <option value="front" selected>Front Face</option>
          <option value="rear">Rear Face</option>
        </select>
      </div>

      <div class="form-group">
        <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
          <input type="checkbox" id="chk-scale-figure" checked>
          <span>6ft Physical Reference Silhouette</span>
        </label>
      </div>

      <div class="metrics-card">
        <div style="font-size:10px; font-weight:700; color:var(--osc-text-muted); text-transform:uppercase;">Thermal & Power Telemetry</div>
        <div class="metric-row">
          <span class="metric-label">RU Occupancy:</span>
          <span class="metric-value" id="metrics-ru">0 / 42 RU (0%)</span>
        </div>
        <div class="metric-row">
          <span class="metric-label">Total Power:</span>
          <span class="metric-value" id="metrics-watts">0 W</span>
        </div>
        <div class="metric-row">
          <span class="metric-label">Thermal Load:</span>
          <span class="metric-value" id="metrics-btu">0 BTU/hr</span>
        </div>
        <div class="metric-row">
          <span class="metric-label">Weight:</span>
          <span class="metric-value" id="metrics-kg">unknown</span>
        </div>
      </div>

      <div style="margin-top:auto; display:flex; flex-direction:column; gap:8px;">
        <button class="btn btn-secondary" id="btn-auto-blank">
          <span>⬛</span> Auto-Blank Empty Slots
        </button>
        <button class="btn btn-secondary" id="btn-clear-fillers">
          <span>🗑</span> Clear Filler Blanks
        </button>
      </div>
    </aside>

    <main class="preview-panel">
      <div class="preview-header">
        <span style="font-size:12px; font-weight:600; color:var(--osc-text-primary);">
          EIA-310-D Dimensionally-True Equipment Rack Elevation (19" Frame)
        </span>
        <button class="btn btn-primary btn-sm" onclick="window.print()">
          <span class="btn-icon">🖨</span> Print / PDF
        </button>
      </div>
      <div class="preview-stage" id="preview-stage"></div>
    </main>

    <section class="data-grid-panel">
      <div class="data-grid-header">
        <span style="font-size:11px; font-weight:600; text-transform:uppercase; color:var(--osc-text-muted);">
          Installed Equipment Schedule (Live Editable)
        </span>
        <div style="display:flex; align-items:center; gap:8px;">
          <button class="btn btn-primary btn-sm" id="btn-add-device" data-apk-library>📚 Library</button>
        </div>
      </div>
      <div class="data-table-container">
        <div id="device-table"></div>
      </div>
    </section>
  </div>

  <script src="./vendor/apk-contracts/apk-contracts.global.js"></script>
  <script src="/FrontEnd/shared/apk-bus.js"></script>
  <script src="./vendor/apk-softapp/apk-softapp.js"></script>
  <script src="./vendor/apk-table/apk-table.js"></script>
  <script type="module" src="./js/elevationApp.js"></script>
</body>
</html>
